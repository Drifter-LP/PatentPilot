<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatentPilot - Splash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 淡入动画容器 */
        .splash-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
        }

        /* Logo/品牌名 */
        .brand {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            color: #0a0a0a;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.2s forwards;
        }

        .brand span {
            color: #14b8a6;
        }

        /* Slogan */
        .slogan {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            color: #6b7280;
            font-weight: 400;
            letter-spacing: 0.02em;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.6s forwards;
        }

        /* 注册按钮 */
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #171717;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards;
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background-color: #14b8a6;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(20, 184, 166, 0.3);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .cta-button svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover svg {
            transform: translateX(4px);
        }

        /* 装饰性背景元素 - 淡淡的动画 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at 30% 30%,
                rgba(20, 184, 166, 0.04) 0%,
                transparent 50%
            ),
            radial-gradient(
                circle at 70% 70%,
                rgba(20, 184, 166, 0.03) 0%,
                transparent 50%
            );
            animation: slowRotate 30s linear infinite;
        }

        /* 浮动的小圆点装饰 */
        .floating-dot {
            position: absolute;
            border-radius: 50%;
            background: rgba(20, 184, 166, 0.08);
            animation: float 6s ease-in-out infinite;
        }

        .floating-dot:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-dot:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-dot:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        /* 底部小字 */
        .footer-text {
            position: absolute;
            bottom: 40px;
            font-size: 0.85rem;
            color: #9ca3af;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 1.5s forwards;
        }

        /* 动画关键帧 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slowRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.05);
            }
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .cta-button {
                padding: 14px 32px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="floating-dot"></div>
        <div class="floating-dot"></div>
        <div class="floating-dot"></div>
    </div>

    <div class="splash-container">
        <h1 class="brand">Patent<span>Pilot</span></h1>
        <p class="slogan">检验你的想法是不是一个申请专利的金点子！</p>
        <a href="#" class="cta-button">
            Get Started
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
        </a>
    </div>

    <p class="footer-text">面向小白创新者与专业科研人员的专利潜力初筛工具 · 非正式法律意见</p>
</body>
</html>
